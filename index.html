<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SITTA UT - Pemesanan &amp; Distribusi Bahan Ajar</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div id="app">
    <!-- Header Aplikasi -->
    <header>
      <div class="brand-wrapper">
        <span class="brand-badge">UT</span>
        <div>
          <h1>SITTA - Bahan Ajar UT</h1>
          <p>Sistem Informasi Tiras dan Transaksi Bahan Ajar Universitas Terbuka</p>
        </div>
      </div>
      <!-- Tab Routing Navigasi State -->
      <nav class="main-nav">
        <button :class="{ active: tab === 'stok' }" @click="tab = 'stok'">
          📦 Stok Bahan Ajar
        </button>
        <button :class="{ active: tab === 'tracking' }" @click="tab = 'tracking'">
          🚚 Tracking DO
        </button>
        <button :class="{ active: tab === 'order' }" @click="tab = 'order'">
          📝 Pemesanan DO Baru
        </button>
      </nav>
    </header>

    <!-- Main Container -->
    <main class="container">
      <div v-if="isLoading" style="text-align: center; padding: 50px;">
        <p>Memuat data bahan ajar SITTA UT...</p>
      </div>

      <div v-else>
        <!-- Halaman 1: Stok Bahan Ajar -->
        <section v-show="tab === 'stok'">
          <ba-stock-table 
            :items="state.stok" 
            :upbjj-list="state.upbjjList" 
            :kategori-list="state.kategoriList">
          </ba-stock-table>
        </section>

        <!-- Halaman 2: Tracking DO -->
        <section v-show="tab === 'tracking'">
          <do-tracking 
            :data="state.tracking">
          </do-tracking>
        </section>

        <!-- Halaman 3: Pemesanan DO Baru -->
        <section v-show="tab === 'order'">
          <order-form 
            :paket="state.paket" 
            :ekspedisi="state.pengirimanList" 
            :tracking-data="state.tracking"
            @created="handleNewDO">
          </order-form>
        </section>
      </div>

      <!-- Reusable App Modal -->
      <app-modal ref="modal"></app-modal>
    </main>
  </div>

  <!-- ==================== VUE TEMPLATES ==================== -->
  <!-- Template Status Badge -->
  <template id="tpl-badge">
    <div class="badge-wrapper" @mouseenter="showTooltip = true" @mouseleave="showTooltip = false">
      <span v-if="qty === 0" class="badge badge-kosong">✕ Kosong</span>
      <span v-else-if="qty < safety" class="badge badge-menipis">⚠ Menipis</span>
      <span v-else class="badge badge-aman">✓ Aman</span>
      <div v-show="showTooltip && catatan" class="tooltip-box">
        <div v-html="catatan"></div>
      </div>
    </div>
  </template>

  <!-- Template Reusable Modal -->
  <template id="tpl-modal">
    <div v-show="isOpen" class="modal-overlay" @keyup.esc="cancel" tabindex="0">
      <div class="modal-content">
        <div class="modal-header">
          <h3 v-text="title"></h3>
          <button class="btn btn-outline btn-sm" @click="cancel">✕</button>
        </div>
        <div class="modal-body">
          <p v-if="message" v-text="message"></p>
          <slot></slot>
        </div>
        <div class="modal-footer">
          <button class="btn btn-outline" @click="cancel" v-text="cancelText"></button>
          <button class="btn" :class="confirmBtnClass" @click="confirm" v-text="confirmText"></button>
        </div>
      </div>
    </div>
  </template>

  <!-- Template Stock Table -->
  <template id="tpl-stock">
    <div class="card">
      <div class="card-title">
        <span>Daftar Stok Bahan Ajar SITTA UT</span>
        <button class="btn btn-primary" @click="openModalAdd">+ Tambah Bahan Ajar</button>
      </div>

      <div class="filter-bar">
        <div class="form-group">
          <label>Filter UT-Daerah:</label>
          <select v-model="filterUpbjj" class="form-control">
            <option value="">-- Semua UT-Daerah --</option>
            <option v-for="(daerah, index) in upbjjList" :key="index" :value="daerah">{{ daerah }}</option>
          </select>
        </div>

        <div class="form-group" v-if="filterUpbjj">
          <label>Filter Kategori (Dependent):</label>
          <select v-model="filterKategori" class="form-control">
            <option value="">-- Semua Kategori --</option>
            <option v-for="(kat, index) in availableCategories" :key="index" :value="kat">{{ kat }}</option>
          </select>
        </div>

        <div class="form-group" style="justify-content: flex-end;">
          <label style="display:flex; align-items:center; gap:6px; cursor:pointer;">
            <input type="checkbox" v-model="filterReorderOnly">
            <span>Tampilkan Re-order Saja (Stok &lt; Safety / Kosong)</span>
          </label>
        </div>

        <div class="form-group">
          <label>Urutkan Berdasarkan:</label>
          <select v-model="sortBy" class="form-control">
            <option value="judul">Judul Mata Kuliah</option>
            <option value="qty">Jumlah Stok</option>
            <option value="harga">Harga</option>
          </select>
        </div>

        <div class="form-group">
          <label>Arah Urut:</label>
          <select v-model="sortOrder" class="form-control">
            <option value="asc">Ascending (A-Z / Rendah-Tinggi)</option>
            <option value="desc">Descending (Z-A / Tinggi-Rendah)</option>
          </select>
        </div>

        <div class="form-group">
          <button class="btn btn-outline" @click="resetFilter">Reset Filter</button>
        </div>
      </div>

      <div class="table-responsive">
        <table class="data-table">
          <thead>
            <tr>
              <th>No</th>
              <th>Kode &amp; Nama Mata Kuliah</th>
              <th>Kategori</th>
              <th>UT-Daerah</th>
              <th>Lokasi Rak</th>
              <th>Harga</th>
              <th>Stok Saat Ini</th>
              <th>Safety Stok</th>
              <th>Status (Hover Catatan)</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody>
            <tr v-if="filteredAndSortedStock.length === 0">
              <td colspan="10" style="text-align:center; padding: 20px; color:#888;">
                Tidak ada data bahan ajar yang sesuai dengan filter.
              </td>
            </tr>
            <tr v-for="(item, index) in filteredAndSortedStock" :key="item.kode">
              <td>{{ index + 1 }}</td>
              <td>
                <strong>{{ item.kode }}</strong><br>
                <span style="color:#555;">{{ item.judul }}</span>
              </td>
              <td>{{ item.kategori }}</td>
              <td>{{ item.upbjj }}</td>
              <td><code>{{ item.lokasiRak }}</code></td>
              <td>{{ item.harga | rupiah }}</td>
              <td><strong>{{ item.qty | buah }}</strong></td>
              <td>{{ item.safety | buah }}</td>
              <td>
                <status-badge :qty="item.qty" :safety="item.safety" :catatan="item.catatanHTML"></status-badge>
              </td>
              <td>
                <div style="display:flex; gap:6px;">
                  <button class="btn btn-warning btn-sm" @click="openModalEdit(item)">Edit</button>
                  <button class="btn btn-danger btn-sm" @click="confirmDelete(item)">Hapus</button>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- Modal Tambah / Update Bahan Ajar -->
      <div v-show="showFormModal" class="modal-overlay">
        <div class="modal-content">
          <div class="modal-header">
            <h3 v-text="isEditMode ? 'Perbarui Data Bahan Ajar' : 'Tambah Bahan Ajar Baru'"></h3>
            <button class="btn btn-outline btn-sm" @click="closeFormModal">✕</button>
          </div>
          <div class="modal-body">
            <p class="help-text" style="margin-bottom:12px;">
              *Tekan tombol <strong>Enter</strong> pada kolom isian untuk langsung menyimpan.
            </p>

            <div class="form-group" style="margin-bottom:10px;">
              <label>Kode Mata Kuliah:</label>
              <input type="text" v-model.trim="formItem.kode" class="form-control" :disabled="isEditMode" @keyup.enter="saveStock">
              <span v-if="errors.kode" class="error-text" v-text="errors.kode"></span>
            </div>

            <div class="form-group" style="margin-bottom:10px;">
              <label>Nama / Judul Mata Kuliah:</label>
              <input type="text" v-model.trim="formItem.judul" class="form-control" @keyup.enter="saveStock">
              <span v-if="errors.judul" class="error-text" v-text="errors.judul"></span>
            </div>

            <div class="form-group" style="margin-bottom:10px;">
              <label>Kategori:</label>
              <select v-model="formItem.kategori" class="form-control">
                <option value="">-- Pilih Kategori --</option>
                <option v-for="(k, idx) in kategoriList" :key="idx" :value="k">{{ k }}</option>
              </select>
              <span v-if="errors.kategori" class="error-text" v-text="errors.kategori"></span>
            </div>

            <div class="form-group" style="margin-bottom:10px;">
              <label>UT-Daerah (UPBJJ):</label>
              <select v-model="formItem.upbjj" class="form-control">
                <option value="">-- Pilih UT-Daerah --</option>
                <option v-for="(u, idx) in upbjjList" :key="idx" :value="u">{{ u }}</option>
              </select>
              <span v-if="errors.upbjj" class="error-text" v-text="errors.upbjj"></span>
            </div>

            <div class="form-group" style="margin-bottom:10px;">
              <label>Lokasi Rak:</label>
              <input type="text" v-model.trim="formItem.lokasiRak" class="form-control" @keyup.enter="saveStock">
              <span v-if="errors.lokasiRak" class="error-text" v-text="errors.lokasiRak"></span>
            </div>

            <div style="display:flex; gap:10px; margin-bottom:10px;">
              <div class="form-group" style="flex:1;">
                <label>Harga (Rp):</label>
                <input type="number" v-model.number="formItem.harga" class="form-control" @keyup.enter="saveStock">
                <span v-if="errors.harga" class="error-text" v-text="errors.harga"></span>
              </div>
              <div class="form-group" style="flex:1;">
                <label>Stok (Qty):</label>
                <input type="number" v-model.number="formItem.qty" class="form-control" @keyup.enter="saveStock">
                <span v-if="errors.qty" class="error-text" v-text="errors.qty"></span>
              </div>
              <div class="form-group" style="flex:1;">
                <label>Safety Stock:</label>
                <input type="number" v-model.number="formItem.safety" class="form-control" @keyup.enter="saveStock">
                <span v-if="errors.safety" class="error-text" v-text="errors.safety"></span>
              </div>
            </div>

            <div class="form-group" style="margin-bottom:10px;">
              <label>Catatan HTML:</label>
              <input type="text" v-model="formItem.catatanHTML" class="form-control" @keyup.enter="saveStock">
            </div>
          </div>
          <div class="modal-footer">
            <button class="btn btn-outline" @click="closeFormModal">Batal</button>
            <button class="btn btn-primary" @click="saveStock">
              {{ isEditMode ? 'Simpan Pembaruan' : 'Simpan Data Baru' }}
            </button>
          </div>
        </div>
      </div>
    </div>
  </template>

  <!-- Template Tracking DO -->
  <template id="tpl-tracking">
    <div class="card">
      <div class="card-title">
        <span>Pelacakan Status Pengiriman Delivery Order (DO)</span>
      </div>

      <div class="filter-bar" style="background:#edf2f7;">
        <div class="form-group" style="flex:1;">
          <label>Cari Berdasarkan Nomor DO atau NIM:</label>
          <input 
            type="text" 
            v-model.trim="searchKeyword" 
            class="form-control"
            placeholder="Ketik Nomor DO (misal: DO2025-001) atau NIM lalu tekan Enter..."
            @keyup.enter="handleSearch"
            @keyup.esc="handleResetSearch">
          <span class="help-text">Tekan <strong>[Enter]</strong> untuk mencari, <strong>[Esc]</strong> untuk reset.</span>
        </div>
        <div class="form-group" style="display:flex; flex-direction:row; gap:8px;">
          <button class="btn btn-primary" @click="handleSearch">Cari DO</button>
          <button class="btn btn-outline" @click="handleResetSearch">Reset</button>
        </div>
      </div>

      <div v-if="filteredTrackingList.length > 0">
        <div v-for="(entry, index) in filteredTrackingList" :key="index" class="card" style="margin-bottom:1.5rem; border-left: 4px solid var(--ut-blue);">
          <div v-for="(detail, doNumber) in entry" :key="doNumber">
            <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; margin-bottom:12px;">
              <div>
                <h3 style="color:var(--ut-blue); margin-bottom:2px;">{{ doNumber }}</h3>
                <span style="font-size:0.85rem; color:#64748b;">
                  Tanggal Pengiriman: {{ detail.tanggalKirim | formatTanggal }}
                </span>
              </div>
              <span class="badge" style="background:#e0f2fe; color:#0369a1; font-size:0.9rem;">
                ● {{ detail.status }}
              </span>
            </div>

            <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap:12px; margin-bottom:1rem; font-size:0.9rem;">
              <div><strong>NIM:</strong> {{ detail.nim }}</div>
              <div><strong>Nama Penerima:</strong> {{ detail.nama }}</div>
              <div><strong>Ekspedisi:</strong> {{ detail.ekspedisi }}</div>
              <div><strong>Paket Bahan Ajar:</strong> {{ detail.paket }}</div>
              <div><strong>Total Biaya:</strong> {{ detail.total | rupiah }}</div>
            </div>

            <h4 style="font-size:1rem; color:#334155; margin-top:1rem; border-bottom:1px solid #e2e8f0; padding-bottom:4px;">
              Riwayat Perjalanan Pengiriman
            </h4>
            <div class="timeline">
              <div v-for="(p, pIdx) in detail.perjalanan" :key="pIdx" class="timeline-item">
                <div class="timeline-point"></div>
                <div class="timeline-time">{{ p.waktu }}</div>
                <div class="timeline-desc">{{ p.keterangan }}</div>
              </div>
            </div>

            <div style="background:#f8fafc; padding:12px; border-radius:6px; margin-top:12px; display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
              <input 
                type="text" 
                v-model.trim="newStatusInputs[doNumber]" 
                class="form-control" 
                placeholder="Tambah keterangan lokasi/status baru..."
                style="flex:1;"
                @keyup.enter="addProgress(detail, doNumber)">
              <button class="btn btn-warning btn-sm" @click="addProgress(detail, doNumber)">
                + Update Perjalanan
              </button>
            </div>
          </div>
        </div>
      </div>

      <div v-else style="text-align:center; padding:30px; color:#64748b;">
        <p v-if="appliedKeyword">Data pengiriman dengan kata kunci "<strong>{{ appliedKeyword }}</strong>" tidak ditemukan.</p>
        <p v-else>Silakan masukkan Nomor DO atau NIM pada kolom pencarian di atas untuk melihat status tracking.</p>
      </div>
    </div>
  </template>

  <!-- Template Order Form -->
  <template id="tpl-order">
    <div class="card" style="max-width: 800px; margin: 0 auto;">
      <div class="card-title">
        <span>Buat Delivery Order (DO) Pemesanan Bahan Ajar Baru</span>
      </div>

      <form @submit.prevent="submitOrder">
        <div class="form-group" style="margin-bottom:12px;">
          <label>Nomor DO (Tergenerate Otomatis):</label>
          <input type="text" :value="generatedDONumber" class="form-control" readonly style="background:#e2e8f0; font-weight:bold; color:var(--ut-blue);">
          <span class="help-text">Format: DO + Tahun Berjalan + Sequence Number</span>
        </div>

        <div style="display:flex; gap:12px; margin-bottom:12px;">
          <div class="form-group" style="flex:1;">
            <label>NIM Mahasiswa:</label>
            <input type="text" v-model.trim="form.nim" class="form-control" placeholder="Contoh: 041234567">
            <span v-if="errors.nim" class="error-text" v-text="errors.nim"></span>
          </div>
          <div class="form-group" style="flex:1;">
            <label>Nama Lengkap:</label>
            <input type="text" v-model.trim="form.nama" class="form-control" placeholder="Contoh: Budi Santoso">
            <span v-if="errors.nama" class="error-text" v-text="errors.nama"></span>
          </div>
        </div>

        <div class="form-group" style="margin-bottom:12px;">
          <label>Pilihan Layanan Ekspedisi:</label>
          <select v-model="form.ekspedisi" class="form-control">
            <option value="">-- Pilih Ekspedisi --</option>
            <option v-for="(eksp, index) in ekspedisi" :key="index" :value="eksp.nama">{{ eksp.nama }}</option>
          </select>
          <span v-if="errors.ekspedisi" class="error-text" v-text="errors.ekspedisi"></span>
        </div>

        <div class="form-group" style="margin-bottom:12px;">
          <label>Paket Bahan Ajar:</label>
          <select v-model="selectedPaketKode" class="form-control">
            <option value="">-- Pilih Paket Bahan Ajar --</option>
            <option v-for="(pkt, index) in paket" :key="index" :value="pkt.kode">
              {{ pkt.kode }} - {{ pkt.nama }}
            </option>
          </select>
          <span v-if="errors.paket" class="error-text" v-text="errors.paket"></span>

          <div v-if="selectedPaketDetail" style="margin-top:8px; padding:12px; background:#f0fdf4; border:1px solid #bbf7d0; border-radius:6px;">
            <strong style="color:#166534;">Isi Paket:</strong>
            <ul style="margin-left: 20px; font-size:0.85rem; color:#14532d; margin-top:4px;">
              <li v-for="(isi, idx) in selectedPaketDetail.isi" :key="idx">
                Modul Bahan Ajar Kode: <strong>{{ isi }}</strong>
              </li>
            </ul>
          </div>
        </div>

        <div style="display:flex; gap:12px; margin-bottom:1.5rem;">
          <div class="form-group" style="flex:1;">
            <label>Tanggal Pengiriman:</label>
            <input type="date" v-model="form.tanggalKirim" class="form-control">
            <span class="help-text">Format Tampilan: {{ form.tanggalKirim | formatTanggal }}</span>
          </div>
          <div class="form-group" style="flex:1;">
            <label>Total Harga Paket:</label>
            <input type="text" :value="form.totalHarga | rupiah" class="form-control" readonly style="background:#e2e8f0; font-weight:bold;">
          </div>
        </div>

        <div style="text-align:right;">
          <button type="submit" class="btn btn-primary" style="padding:10px 24px;">Buat Delivery Order (DO) Baru</button>
        </div>
      </form>
    </div>
  </template>

  <!-- ==================== SCRIPTS (URUTAN PENTING) ==================== -->
  <script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"></script>
  <script src="js/services/api.js"></script>
  <script src="js/components/status-badge.js"></script>
  <script src="js/components/stock-table.js"></script>
  <script src="js/components/do-tracking.js"></script>
  <script src="js/components/order-form.js"></script>
  <script src="js/components/app-modal.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
